# Configuration minimale Nginx pour Laravel.
# Nginx reçoit les requêtes HTTP et transmet le PHP au conteneur "app" (PHP-FPM).

server {
    listen 80;
    index index.php index.html;

    # Le point d'entrée de toute application Laravel est le dossier public/
    root /var/www/html/public;

    location / {
        # try_files : Laravel gère lui-même le routing, donc on redirige
        # tout vers index.php si le fichier demandé n'existe pas physiquement
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # On transmet les fichiers .php au conteneur "app" sur le port 9000 (PHP-FPM)
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Sécurité de base : on interdit l'accès direct aux fichiers cachés (ex: .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
